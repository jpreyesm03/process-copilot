# ---------- time / bottlenecks ----------
[[q]]
id = "time_01"
type = "time"
question = "What is the median number of days from creating a purchase order item to its first goods receipt?"
key_sql = """
WITH f AS (
  SELECT case_id,
         min(ts) FILTER (WHERE activity = 'Create Purchase Order Item') AS created,
         min(ts) FILTER (WHERE activity = 'Record Goods Receipt') AS received
  FROM events WHERE is_canonical AND ts_status IN ('ok', 'repaired') GROUP BY 1)
SELECT round(median(date_diff('second', created, received) / 86400.0), 1)
FROM f WHERE received >= created"""
numbers = [10.0]
tol = 0.05

[[q]]
id = "time_02"
type = "time"
question = "Which item category takes longest from order to payment for first-time payments, and what is its median?"
key_sql = """
SELECT c.item_category, round(median(y.days), 1)
FROM cycles y JOIN cases c USING (case_id)
WHERE y.cycle_no = 1 AND y.is_closed GROUP BY 1 ORDER BY 2 DESC LIMIT 1"""
numbers = [77.9]
mentions = ["invoice after GR"]
tol = 0.02

[[q]]
id = "time_03"
type = "time"
question = "For 2-way match lines, what is the median time from order to first payment?"
key_sql = """
SELECT round(median(y.days), 1)
FROM cycles y JOIN cases c USING (case_id)
WHERE y.cycle_no = 1 AND y.is_closed AND c.item_category = '2-way match'"""
numbers = [39.7]
tol = 0.02

