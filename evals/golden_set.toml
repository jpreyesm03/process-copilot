mentions = ["vendorID_0104"]

[[q]]
id = "vend_02"
type = "vendors"
question = "Which vendor has the most order lines that needed a payment block removed?"
key_sql = """
SELECT c.vendor, count(DISTINCT e.case_id) FROM events e JOIN cases c USING (case_id)
WHERE e.activity = 'Remove Payment Block' GROUP BY 1 ORDER BY 2 DESC LIMIT 1"""
numbers = [6765]
mentions = ["vendorID_0136"]

[[q]]
id = "vend_03"
type = "vendors"
question = "Among vendors with at least 1,000 order lines, which has the highest share of lines with a payment block removed?"
key_sql = """
SELECT vendor, round(avg(blocked::int) * 100, 1) FROM (
  SELECT c.case_id, c.vendor, bool_or(e.activity = 'Remove Payment Block') AS blocked
  FROM cases c JOIN events e USING (case_id) GROUP BY 1, 2)
GROUP BY 1 HAVING count(*) >= 1000 ORDER BY 2 DESC LIMIT 1"""
numbers = [65.3]
mentions = ["vendorID_0278"]

