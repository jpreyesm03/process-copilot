[[q]]
id = "h2_why_slow_line"
type = "case"
split = "heldout2"
question = "Why did order line 4508051115_00050 take so long?"
key_sql = """
SELECT days FROM waits WHERE case_id = '4508051115_00050'
UNION ALL SELECT days FROM cycles WHERE case_id = '4508051115_00050' AND cycle_no = 1"""
numbers = [139.1, 114.9]
tol = 0.05
mentions = ["Remove Payment Block|payment block", "Clear Invoice|paid|payment"]
tool = "get_case_timeline"
judge = [
  "Names the Remove Payment Block -> Clear Invoice wait (about 115 days, from 17 Sep 2018 to 10 Jan 2019) as the main delay",
  "Gives the line total as about 139 days and shows the other gaps are small (Create PO -> Goods Receipt about 18 days, the rest under 6 days)",
  "Compares the long wait with the same gap at vendorID_0136 (median about 100 days, so typical for this vendor, roughly the 87th percentile) and/or across all vendors (median about 25 days, about the 98th percentile)",
  "Does not claim the payment was due or overdue, and invents no cause (e.g. dispute, cash-flow decision, payment terms) that the events do not show"
]
label = """The line took 139 days in total, and 114.9 of them (about 83%) sit between Remove Payment Block (17 Sep 2018) and Clear Invoice (10 Jan 2019); goods were received after 18 days and the invoice was received and unblocked within about 6 days of that. That wait is typical for vendorID_0136 (median 99.9 days over 5,465 such gaps, about the 87th percentile) but very long against all vendors (median 25.1 days, about the 98th percentile). The data does not show why payment took that long."""
