# Golden set: 20 dev questions (used to find and fix failures), 4 held out (never used for tuning)
# and 5 guard questions (out-of-scope tricks + one borderline in-scope question).
#
# Every key is computed by `key_sql` against the full warehouse (tests/test_golden_set.py re-runs them),
# never by the model. Grading fields:
#   numbers      values the answer must contain (relative tolerance `tol`, default 1%)
#   mentions     strings the answer must contain (case-insensitive; 'a|b' = either)
#   tool         a tool the agent must have called
#   assume       ambiguous question: must state assumptions and suggest a confirming question (D9)
#   refuse       unanswerable: must say the data can't answer and give no invented figure
#   judge        rules checked by an LLM judge (case questions)

