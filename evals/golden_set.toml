[[q]]
id = "h2_po_to_gr"
type = "time"
split = "heldout2"
question = "For Standard PO lines that have a goods receipt, what is the median number of days from the creation of the order line to its first goods receipt?"
key_sql = """
WITH p AS (SELECT case_id, ts FROM events WHERE is_canonical AND ts_status IN ('ok','repaired') AND activity='Create Purchase Order Item'),
g AS (SELECT case_id, min(ts) ts FROM events WHERE is_canonical AND ts_status IN ('ok','repaired') AND activity='Record Goods Receipt' GROUP BY 1)
SELECT count(*), median(epoch(g.ts - p.ts)/86400.0)
FROM p JOIN g USING (case_id) JOIN cases c USING (case_id)
WHERE c.document_type = 'Standard PO'
"""
numbers = [10.0]
tol = 0.05
mentions = ["median"]

