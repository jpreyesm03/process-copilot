# ---------- ambiguous (D9: business reading + assumptions + confirming question) ----------
[[q]]
id = "amb_01"
type = "ambiguous"
question = "How many order lines are unpaid, and how much money is that?"
key_sql = """
WITH l AS (
  SELECT c.case_id, c.value_eur, c.start_ts,
         bool_or(e.activity = 'Record Goods Receipt') AS gr,
         bool_or(e.activity = 'Record Invoice Receipt') AS ir,
         bool_or(e.activity = 'Clear Invoice') AS paid,
         bool_or(e.activity = 'Delete Purchase Order Item') AS deleted
  FROM cases c JOIN events e USING (case_id) GROUP BY 1, 2, 3)
SELECT count(*), round(sum(value_eur) / 1e6, 1) FROM l
WHERE gr AND ir AND NOT paid AND NOT deleted AND start_ts < '2018-10-01'"""
numbers = [4302, 16.3]
assume = true
tol = 0.02

[[q]]
id = "amb_02"
type = "ambiguous"
question = "How long does it take us to pay an invoice?"
key_sql = """
WITH f AS (
  SELECT case_id,
         min(ts) FILTER (WHERE activity = 'Record Invoice Receipt') AS received,
         min(ts) FILTER (WHERE activity = 'Clear Invoice') AS paid
  FROM events WHERE is_canonical AND ts_status IN ('ok', 'repaired') GROUP BY 1)
SELECT round(median(date_diff('second', received, paid) / 86400.0), 1) FROM f WHERE paid >= received"""
numbers = [42.1]
assume = true
tol = 0.05
