# ---------- single line: why slow (labelled by JP, 2026-10-18) ----------
# numbers = the main waits in days; bonus_numbers = peer medians (only gradable once the tool benchmarks);
# judge = rules for the LLM judge; label = the full reference answer.

[[q]]
id = "case_01"
type = "case"
question = "Why did order line 4507000365_00010 take so long?"
key_sql = """
SELECT activity, round(date_diff('second', lag(ts) OVER (ORDER BY seq), ts) / 86400.0, 1) AS wait_days
FROM events WHERE case_id = '4507000365_00010' AND is_canonical AND seq IS NOT NULL ORDER BY seq"""
tool = "get_case_timeline"
numbers = [40.0, 42.5]
tol = 0.05
mentions = ["payment block"]
bonus_numbers = [98.7, 6.3, 21.5]
judge = ["Does not blame delivery or the goods receipt (it took 0.4 days)", "Invents no cause the events do not show (e.g. a dispute, a holiday)"]
label = """142 days vs a vendor median of 99 (94th pct): abnormal. Delivery was fast. Two abnormal waits: the payment block took 40 days to remove (vendor median 6.3, +34) and the invoice came 42.5 days after the order (median 21.5, +21). The last 58 days to payment are normal for this vendor but slow vs similar lines (74th pct): a vendor-level pattern."""

[[q]]
id = "case_02"
type = "case"
question = "Why did order line 4507000414_00010 take so long?"
key_sql = """
SELECT activity, round(date_diff('second', lag(ts) OVER (ORDER BY seq), ts) / 86400.0, 1) AS wait_days
FROM events WHERE case_id = '4507000414_00010' AND is_canonical AND seq IS NOT NULL ORDER BY seq"""
tool = "get_case_timeline"
numbers = [86.7]
tol = 0.05
mentions = ["invoice"]
bonus_numbers = [112.9, 7.6]
judge = ["Names the gap between the vendor's invoice date and recording the invoice as the main delay", "Invents no cause the events do not show"]
label = """122 days: normal for this vendor (59th pct), whose lines are slow in general (median 113 vs 80 for similar lines). One abnormal wait: the vendor's invoice was recorded 87 days after its invoice date (vendor median 7.6, 96th pct, +79). Fast handling afterwards (block removed in 1.6 days, paid 6 days later) hid most of that delay in the total."""

[[q]]
id = "case_03"
type = "case"
question = "Why did order line 4507000905_00050 take so long?"
key_sql = """
SELECT activity, round(date_diff('second', lag(ts) OVER (ORDER BY seq), ts) / 86400.0, 1) AS wait_days
FROM events WHERE case_id = '4507000905_00050' AND is_canonical AND seq IS NOT NULL ORDER BY seq"""
tool = "get_case_timeline"
numbers = [113.1]
tol = 0.05
mentions = ["goods receipt", "invoice"]
bonus_numbers = [115.1, 35.0]
judge = ["Names recording the invoice after goods receipt as the main delay", "Notes that payment after recording was fast (under a day)", "Invents no cause the events do not show"]
label = """147 days vs a vendor median of 115 (93rd pct): abnormal. One step explains it: the invoice was recorded 113 days after the goods arrived (vendor median 35, 97th pct, +78), although the vendor's invoice was dated before the goods receipt. Once recorded, it was paid within a day (4th pct), so the delay was entirely in recording the invoice."""

[[q]]
id = "case_04"
type = "case"
question = "Why did order line 4507004456_00010 take so long?"
key_sql = """
SELECT activity, round(date_diff('second', lag(ts) OVER (ORDER BY seq), ts) / 86400.0, 1) AS wait_days
FROM events WHERE case_id = '4507004456_00010' AND is_canonical AND seq IS NOT NULL ORDER BY seq"""
tool = "get_case_timeline"
numbers = [104.1]
tol = 0.05
mentions = ["Change Price|price change|price was changed"]
bonus_numbers = [71.1, 6.9]
judge = ["Names the price change after the invoice as the main delay", "Invents no cause the events do not show (e.g. calling it a price dispute)"]
label = """136 days vs a vendor median of 71 (88th pct) and 80 for similar lines (93rd): abnormal. Ordering, delivery and invoice took 10 days. The delay is a price change, a rare event (5% of lines), made 104 days after the invoice was recorded (similar median 6.9, 95th pct). The payment block was removed 20 days later, and payment followed in 2 days. Price changes are a pattern at this vendor: 13% of its lines have one, and those take a median of 129 days vs 66 without."""

# ---------- vendors / rankings ----------
[[q]]
id = "vend_01"
type = "vendors"
question = "Which vendor has the highest total ordered value, and how much?"
key_sql = "SELECT vendor, round(sum(value_eur) / 1e6, 1) FROM cases GROUP BY 1 ORDER BY 2 DESC LIMIT 1"
